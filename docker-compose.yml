version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: radar-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: radar_user
      POSTGRES_PASSWORD: radar_password
      POSTGRES_DB: radar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: