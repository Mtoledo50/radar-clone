# =================================================================
# ARQUIVO: .github/workflows/deploy.yml
# =================================================================
# Pipeline de CI/CD para Radar Conta Certa (ADR-088)
# Valida build, lint e type-check em cada push/PR na branch main.
# Preparado para deploy futuro em VPS/Render/Railway.
# =================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancela workflows anteriores se houver novo push (economia de minutos)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =================================================================
  # JOB 1: Validação do Backend (NestJS)
  # =================================================================
  backend-check:
    name: 🔍 Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint --if-present
        continue-on-error: true  # Não bloqueia se não houver script lint

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate

      - name: ✅ Type check & Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
          JWT_SECRET: "test-secret-for-ci"
          JWT_EXPIRATION: "7d"
          NODE_ENV: test

  # =================================================================
  # JOB 2: Validação do Frontend (Next.js)
  # =================================================================
  frontend-check:
    name:  Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint check
        run: npm run lint --if-present
        continue-on-error: true

      - name: ✅ Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NEXT_PUBLIC_SENTRY_DSN: ""
          NEXT_PUBLIC_APP_NAME: "Radar Conta Certa (CI)"

  # =================================================================
  # JOB 3: Segurança (Audit de dependências)
  # =================================================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name:  Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name:  Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: 🔍 Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true