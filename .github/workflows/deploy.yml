# =================================================================
# ARQUIVO: .github/workflows/deploy.yml
# =================================================================
# Pipeline de CI/CD básico para validação de build e testes (ADR-088).
# Executa em pushes para a branch 'main' e em Pull Requests.
# =================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # Job 1: Validação do Backend (NestJS)
  # ---------------------------------------------------------------
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check & Build
        run: npm run build

  # ---------------------------------------------------------------
  # Job 2: Validação do Frontend (Next.js)
  # ---------------------------------------------------------------
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check & Build (Next.js)
        run: npm run build
        env:
          # Variáveis de ambiente mockadas para o build passar no CI
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SENTRY_DSN: '' 